#
# スキーマは docs/DOMAIN.md §6.1 が正。
#
# magic_rgb は ALPS 公式マニュアル記載の値であり、推測値ではない。
# 英語版(MD-5000P Online User's Guide p44/51/63)と日本語版(MD-5000
# オンラインマニュアル p36/41/52)の双方で同一の値を確認済み。
#
# 重要: 日本国内版と海外版でインクの名称が異なる。値と printer_code は同一。
#   海外 MetallicMagenta = 国内 メタリックレッド (MDC-METR)
#   海外 MetallicCyan    = 国内 メタリックブルー (MDC-METB)
# name は ppmtomd の識別子を採用しているため海外名だが、label は利用者が
# 実物のパッケージと照合する値なので国内名を使う(DOMAIN §13.5)。
#
# order は昇順に実行され、先に刷ったものが下の層になる(DOMAIN §4.3)。
# 白の下地が最小値、最後に見せたいものが最大値。
#
# 注意: 白(230,230,230)と銀(189,193,197)は近い。tolerance を大きく取ると
# 誤判定する。両方を同時に使う場合は特に注意(DOMAIN §6.1)。
# 白は純白 255,255,255 ではない。255 は「印刷しない領域」。

# printer_code は golden のバイト列から読み取った実測値(DOMAIN §6.5)。
# magic_rgb がアプリ側で置く色であるのに対し、printer_code はプリンタへ
# 送る値。層が違うので混同しないこと。

inks:
  - name: white
    label: 紙用特色ホワイト (MDC-SCWH)
    magic_rgb: [230, 230, 230]
    printer_code: 0x0B
    barcode: 16        # カセットのバーコード番号(D-026 / DOMAIN §13.7.5)。printer_code とは別体系
    tolerance: 8
    order: 10
    auto_undercoat: true
    # 暫定値。実測で置き換える(DOMAIN §10.5)。
    # 既定を 2 から 1 に変更(D-038): §10.5 の「実運用値 4 回程度」より薄い側だが、
    # ジョブごとに変えられる(D-031)ため薄いほうから試せる既定とした。
    # パス数が減ればカセット交換の回数も減る。
    passes: 1

  # メタリック系は同格のため order が同値。この 4 行の並び順がそのまま
  # 実行順になる(DOMAIN §4.3 の tie-break = 記述順)。順序を変えたい
  # ときは行を入れ替える。実装は安定ソートを使うこと(§4.9)。
  - name: metallic_gold
    label: メタリックゴールド (MDC-METG)
    magic_rgb: [225, 160, 0]
    printer_code: 0x04
    barcode: 8
    tolerance: 12
    order: 50

  - name: metallic_silver
    label: メタリックシルバー (MDC-METS)
    magic_rgb: [189, 193, 197]
    printer_code: 0x07
    barcode: 11
    tolerance: 12
    order: 50

  - name: metallic_magenta
    label: メタリックレッド (MDC-METR)
    magic_rgb: [163, 36, 115]
    printer_code: 0x05
    barcode: 9
    tolerance: 12
    order: 50

  - name: metallic_cyan
    label: メタリックブルー (MDC-METB)
    magic_rgb: [0, 176, 201]
    printer_code: 0x06
    barcode: 10
    tolerance: 12
    order: 50

  # プロセスインク(CMYK 分解の受け皿。DOMAIN §6.1 / D-019)。magic_rgb を
  # 持たないため特色マッチングの対象にはならない。printer_code は
  # ppmtomd 1.6 の mddata.h 実測値(推測値ではない)。
  - name: cyan
    label: 紙用シアン (MDC-FLCC)
    printer_code: 0x01
    barcode: 3
    channel: C
    order: 60

  - name: magenta
    label: 紙用マゼンタ (MDC-FLCM)
    printer_code: 0x02
    barcode: 2
    channel: M
    order: 70

  - name: yellow
    label: 紙用イエロー (MDC-FLCY)
    printer_code: 0x03
    barcode: 1
    channel: Y
    order: 80

  - name: black
    label: 紙用ブラック (MDC-FLCK)
    magic_rgb: [0, 0, 0]
    printer_code: 0x00
    barcode: 0
    tolerance: 8
    channel: K
    order: 90

  # 「塗る範囲で決まるインク」(D-048 / DOMAIN §14.7)。magic_rgb も channel も
  # 持たず、どこに塗るかはジョブごとに coverage_modes で選ぶ
  # (none / artwork / full)。既定は none なので、指定しなければジョブに出ない。
  # ハーフトーンも色補正も掛からない — 塗るか塗らないかだけ(ppmtomd man:564-565)。
  #
  # printer_code / barcode は ppmtomd 1.6 のソースから取った実測値であり
  # 推測値ではない: vendor/ppmtomd-1.6/mddata.c:104,106(色 → バーコードの
  # 対応表)と mddata.h:75-76(barVPhotoPrimer = 18 / barFinishII = 19)。
  # 既定 9 色の 18 項目でこの読み方が正しいことを検算済み(DOMAIN §14.7)。
  #
  # 注意: MF インクは実機で刷って確かめていない(D-048 決定 6)。
  # 値は検算済みの表から取っているが、実物での動作は未検証。
  - name: mf_ink
    label: 紙用 MF インク (MDC-PREP)
    printer_code: 0x10
    barcode: 18
    order: 5            # 白(10)より前 = 下地として最初に刷る
    coverage: true
    passes: 1

  - name: glossy_finish
    label: 紙用光沢仕上げ2 (MDC-FRVG)
    printer_code: 0x0E
    barcode: 19
    order: 95           # 黒(90)より後 = 最後に上掛けする
    coverage: true
    passes: 1
